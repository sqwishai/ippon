[project]
name = "ippon"
version = "0.2.1"
description = "Run decision models on your Mac, fast."
dynamic = ["readme"]  # README.md, with its links made absolute for PyPI: [tool.hatch.metadata.hooks.fancy-pypi-readme]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "backports.zstd>=1.0; python_version < '3.14'",  # zstd request bodies for serve, as TypeSafe's SDK sends them
    "huggingface-hub>=2.2",
    "mlx>=0.32.4,<0.33",
    "numpy>=1.24",
    "packaging>=24",  # the MLX versions `ippon doctor` was tested with, read as pip reads them (PEP 440)
    "pillow>=11",  # images in requests, decoded as the creators' code decodes them (media/decode.py)
    "pyyaml>=6",  # model cards' front matter, read as huggingface_hub reads it (licences.py)
    "av>=18.1",  # videos, decoded as the models' creators decode them (media/lfm3_video.py)
    # videos, for models whose creators decode them with OpenCV (media/d3_video.py); 5.1 decodes the reference clips
    # to different pixels than the creators' runtime, so it stays on 5.0 until the references are checked again
    "opencv-python-headless>=5.0,<5.1",
    "tokenizers>=0.21",
]
keywords = ["mlx", "apple-silicon", "metal", "decision-models", "classification", "local-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sqwishai/ippon"
Documentation = "https://github.com/sqwishai/ippon/tree/main/docs"
Changelog = "https://github.com/sqwishai/ippon/blob/main/CHANGELOG.md"
Issues = "https://github.com/sqwishai/ippon/issues"

[project.scripts]
ippon = "ippon.__main__:main"

[project.entry-points."ippon.adapters"]
"vllm-sr/d3" = "ippon.adapters.d3:D3"
"liquid/d1" = "ippon.adapters.d1:D1"
"jgeuter/jeff" = "ippon.adapters.jeff:Jeff"
"cloudflare/clef" = "ippon.adapters.clef:Clef"
"perplexity/pplx-decider" = "ippon.adapters.perplexity:Perplexity"
"fastino/glide" = "ippon.adapters.glide:Glide"
"torchcast/decision" = "ippon.adapters.torchcast:Torchcast"
"h2oai/h2o-lightning" = "ippon.adapters.h2o:H2OLightning"
"jaredpalmer/kev" = "ippon.adapters.kev:Kev"
"autotrust/decider" = "ippon.adapters.autotrust:AutoTrust"
"baselabs/elephant" = "ippon.adapters.elephant:Elephant"
"strands/decider" = "ippon.adapters.strands:Strands"
"sqwish/kettei" = "ippon.adapters.kettei:Kettei"
"generic/classifier" = "ippon.adapters.classifier:Classifier"
"generic/label-tokens" = "ippon.adapters.label_tokens:LabelTokens"

[dependency-groups]
dev = [
    "jinja2>=3.1",
    "mypy>=1.13",
    "numpy>=2.2.6",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqwishai>=0.5",
    "transformers>=5",
    "types-pyyaml==6.0.12.20261113",  # yaml's types for mypy (licences.py)
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# PyPI shows the README without the repository around it, so its relative images and links point at GitHub there:
# images at raw.githubusercontent.com, directories at tree/main, files at blob/main. README.md itself is unchanged.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]  # ![alt](path)
pattern = '!\[([^\]]*)\]\((?![a-z][a-z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/sqwishai/ippon/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]  # <img src="path">, <source srcset="path">
pattern = '\b(src|srcset)="(?![a-z][a-z0-9+.-]*:|#)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/sqwishai/ippon/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]  # [text](directory/)
pattern = '\]\((?![a-z][a-z0-9+.-]*:|#)([^)\s]*/)((?:#[^)\s]*)?)\)'
replacement = '](https://github.com/sqwishai/ippon/tree/main/\1\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]  # [text](file), [text](file#anchor)
pattern = '\]\((?![a-z][a-z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '](https://github.com/sqwishai/ippon/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]  # <a href="file">
pattern = '\bhref="(?![a-z][a-z0-9+.-]*:|#)([^"]+)"'
replacement = 'href="https://github.com/sqwishai/ippon/blob/main/\1"'

[tool.hatch.build.targets.wheel]
packages = ["src/ippon"]

[tool.hatch.build.targets.sdist]  # the library and what building it needs; references, benchmarks and tests stay in git
include = [
    "/src/ippon", "/native/Cargo.toml", "/native/Cargo.lock", "/native/src", "/hatch_build.py", "/README.md",
    "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/references/*/*.json.gz",
]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: the native library (Rust), and the git revision

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = false
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET", "PLE", "PERF", "PLW1510"]
ignore = [
    "N818",  # the exceptions read as what went wrong: InvalidRequest, UnsupportedModel
    "PERF401",  # explicit accumulation keeps reference math and multi-stage runtime loops readable
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlx_vlm", "mlx_vlm.*", "clef_mlx", "mlx_lm", "mlx_lm.*", "mlx_embeddings", "mlx_embeddings.*", "torch", "transformers", "glide"]  # what compare_arms/ run in other environments
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]  # a dev dependency for the SDK's renderer: compare_arms/ is checked as before
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "metal: needs an Apple GPU; skipped elsewhere",
    "nax: needs an M5's neural accelerators; skipped elsewhere",
]
