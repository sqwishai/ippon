<svg xmlns="http://www.w3.org/2000/svg" width="830" height="359" viewBox="0 0 830 359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="elephant-1">
<title>elephant-1</title>
<desc>Orange bars are ippon and blue bars another runtime on the same build. Every workload has its own linear scale from zero.</desc>
<rect width="830" height="359" fill="#0d1117"/>
<text x="16.0" y="20.0" font-size="12" font-weight="400" text-anchor="start" fill="#9198a1">ippon in orange, the other runtime in blue, both on the same build</text>
<text x="16.0" y="51.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Typical call</text>
<text x="16.0" y="65.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~500 tokens, 3 questions</text>
<text x="16.0" y="79.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="52.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="41.0" width="38.0" height="14" rx="3" fill="#d95926"><title>411.965000 ms</title></rect>
<text x="404.0" y="52.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">412 ms</text>
<text x="350.0" y="74.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Base Labs&#x27; runtime</text>
<rect x="360" y="63.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>2,062.060000 ms</title></rect>
<text x="556.0" y="74.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">2,062 ms</text>
<text x="814.0" y="74.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">takes 5x as long</text>
<text x="16.0" y="119.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Same context again</text>
<text x="16.0" y="133.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~1,000 tokens, a new question</text>
<text x="16.0" y="147.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="120.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="109.0" width="4.7" height="14" rx="3" fill="#d95926"><title>73.085000 ms</title></rect>
<text x="370.7" y="120.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">73 ms</text>
<text x="350.0" y="142.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Base Labs&#x27; runtime</text>
<rect x="360" y="131.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>2,979.275000 ms</title></rect>
<text x="556.0" y="142.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">2,979 ms</text>
<text x="814.0" y="142.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">takes 41x as long</text>
<text x="16.0" y="187.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Context grown</text>
<text x="16.0" y="201.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~1,000 tokens and one ~60-token</text>
<text x="16.0" y="215.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">message</text>
<text x="16.0" y="229.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="188.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="177.0" width="40.7" height="14" rx="3" fill="#d95926"><title>898.530000 ms</title></rect>
<text x="406.7" y="188.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">899 ms</text>
<text x="350.0" y="210.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Base Labs&#x27; runtime</text>
<rect x="360" y="199.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>4,191.840000 ms</title></rect>
<text x="556.0" y="210.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">4,192 ms</text>
<text x="814.0" y="210.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">takes 4.7x as long</text>
<text x="16.0" y="269.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">16 clients at once</text>
<text x="16.0" y="283.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">short requests, 1 question each</text>
<text x="16.0" y="297.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">requests per second, higher is</text>
<text x="16.0" y="311.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">better</text>
<text x="350.0" y="270.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="259.0" width="190.0" height="14" rx="3" fill="#d95926"><title>3.607856 req/s</title></rect>
<text x="556.0" y="270.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">3.61 req/s</text>
<text x="350.0" y="292.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Base Labs&#x27; runtime</text>
<rect x="360" y="281.0" width="49.9" height="14" rx="3" fill="#3987e5"><title>0.946599 req/s</title></rect>
<text x="415.9" y="292.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">0.95 req/s</text>
<text x="814.0" y="292.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon: 3.8x the answers a second</text>
<text x="16.0" y="340.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">Apple M5 Pro, 48 GB · each value is the median over the same requests · method and versions in docs/benchmarks.md</text>
</svg>
