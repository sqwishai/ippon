<text x="350.0" y="292.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Fastino&#x27;s server</text>
<rect x="360" y="281.0" width="44.8" height="14" rx="3" fill="#3987e5"><title>0.908648 req/s</title></rect>
<text x="410.8" y="292.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">0.91 req/s</text>
