<text x="350.0" y="74.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Fastino&#x27;s server</text>
<rect x="360" y="63.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>5,968.310000 ms</title></rect>
<text x="556.0" y="74.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">5,968 ms</text>
<text x="814.0" y="74.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon 4.8x faster</text>
