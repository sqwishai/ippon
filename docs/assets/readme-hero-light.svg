<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 214" width="830" height="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Time to answer the same requests, and how much faster ippon is than each runtime"><text x="200" y="18" font-size="15" font-weight="600" fill="#1f2328">On average, over every model and workload</text><text x="190" y="55" text-anchor="end" font-size="15" font-weight="600" fill="#1f2328">ippon</text><rect x="200" y="40" width="125.3" height="20" rx="3" fill="#eb6834"/><text x="333.3" y="55" font-size="14" font-weight="600" fill="#1f2328"></text><text x="190" y="89" text-anchor="end" font-size="15" font-weight="400" fill="#1f2328">Ollama</text><rect x="200" y="74" width="167.3" height="20" rx="3" fill="#2a78d6"/><text x="375.3" y="89" font-size="14" font-weight="400" fill="#59636e">ippon 34% faster</text><text x="190" y="123" text-anchor="end" font-size="15" font-weight="400" fill="#1f2328">oMLX</text><rect x="200" y="108" width="193.8" height="20" rx="3" fill="#2a78d6"/><text x="401.8" y="123" font-size="14" font-weight="400" fill="#59636e">ippon 55% faster</text><text x="190" y="157" text-anchor="end" font-size="15" font-weight="400" fill="#1f2328">llama.cpp</text><rect x="200" y="142" width="424.7" height="20" rx="3" fill="#2a78d6"/><text x="632.7" y="157" font-size="14" font-weight="400" fill="#59636e">ippon 3.4x faster</text><text x="190" y="191" text-anchor="end" font-size="15" font-weight="400" fill="#1f2328">the creators&#x27; own code</text><rect x="200" y="176" width="500.0" height="20" rx="3" fill="#2a78d6"/><text x="708.0" y="191" font-size="14" font-weight="400" fill="#59636e">ippon 4x faster</text></svg>
