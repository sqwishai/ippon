<svg xmlns="http://www.w3.org/2000/svg" width="830" height="359" viewBox="0 0 830 359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Strands-Decider-E4B">
<title>Strands-Decider-E4B</title>
<desc>Orange bars are ippon and blue bars another runtime on the same build. Every workload has its own linear scale from zero.</desc>
