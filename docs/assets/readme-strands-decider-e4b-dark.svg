<rect x="360" y="281.0" width="113.9" height="14" rx="3" fill="#3987e5"><title>5.286722 req/s</title></rect>
<text x="479.9" y="292.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">5.29 req/s</text>
