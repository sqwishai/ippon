<text x="16.0" y="215.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">message</text>
<text x="16.0" y="229.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="188.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="177.0" width="69.3" height="14" rx="3" fill="#d95926"><title>472.520000 ms</title></rect>
