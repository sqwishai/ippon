<text x="350.0" y="142.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">AWS Strands&#x27; server</text>
<rect x="360" y="131.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>670.190000 ms</title></rect>
<text x="556.0" y="142.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">670 ms</text>
