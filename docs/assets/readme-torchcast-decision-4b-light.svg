<svg xmlns="http://www.w3.org/2000/svg" width="830" height="495" viewBox="0 0 830 495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Torchcast Decision 4B">
<title>Torchcast Decision 4B</title>
