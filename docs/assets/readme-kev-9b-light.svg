<svg xmlns="http://www.w3.org/2000/svg" width="830" height="359" viewBox="0 0 830 359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kev-9B">
<title>Kev-9B</title>
