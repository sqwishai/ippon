<text x="16.0" y="229.0" font-size="11" font-weight="400" text-anchor="start" fill="#59636e">ms, shorter is better</text>
<text x="350.0" y="188.0" font-size="11" font-weight="600" text-anchor="end" fill="#1f2328">ippon</text>
