<svg xmlns="http://www.w3.org/2000/svg" width="830" height="359" viewBox="0 0 830 359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kev-4B">
<title>Kev-4B</title>
<desc>Orange bars are ippon and blue bars another runtime on the same build. Every workload has its own linear scale from zero.</desc>
<rect width="830" height="359" fill="#0d1117"/>
<text x="16.0" y="20.0" font-size="12" font-weight="400" text-anchor="start" fill="#9198a1">ippon in orange, the other runtime in blue, both on the same build</text>
<text x="16.0" y="51.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Typical call</text>
<text x="16.0" y="65.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~500 tokens, 3 questions</text>
<text x="16.0" y="79.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="52.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="41.0" width="132.1" height="14" rx="3" fill="#d95926"><title>186.655000 ms</title></rect>
<text x="498.1" y="52.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">187 ms</text>
<text x="350.0" y="74.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Jared Palmer&#x27;s server</text>
<rect x="360" y="63.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>268.525000 ms</title></rect>
<text x="556.0" y="74.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">269 ms</text>
<text x="814.0" y="74.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">takes 44% longer</text>
<text x="16.0" y="119.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Same context again</text>
<text x="16.0" y="133.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~1,000 tokens, a new question</text>
<text x="16.0" y="147.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="120.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="109.0" width="131.4" height="14" rx="3" fill="#d95926"><title>36.855000 ms</title></rect>
<text x="497.4" y="120.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">37 ms</text>
<text x="350.0" y="142.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Jared Palmer&#x27;s server</text>
<rect x="360" y="131.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>53.310000 ms</title></rect>
<text x="556.0" y="142.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">53 ms</text>
<text x="814.0" y="142.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">takes 45% longer</text>
<text x="16.0" y="187.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Context grown</text>
<text x="16.0" y="201.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~1,000 tokens and one ~60-token</text>
<text x="16.0" y="215.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">message</text>
<text x="16.0" y="229.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="188.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="177.0" width="16.1" height="14" rx="3" fill="#d95926"><title>44.620000 ms</title></rect>
<text x="382.1" y="188.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">45 ms</text>
<text x="350.0" y="210.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Jared Palmer&#x27;s server</text>
<rect x="360" y="199.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>528.140000 ms</title></rect>
<text x="556.0" y="210.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">528 ms</text>
<text x="814.0" y="210.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">takes 12x as long</text>
<text x="16.0" y="269.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">16 clients at once</text>
<text x="16.0" y="283.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">short requests, 1 question each</text>
<text x="16.0" y="297.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">requests per second, higher is</text>
<text x="16.0" y="311.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">better</text>
<text x="350.0" y="270.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="259.0" width="190.0" height="14" rx="3" fill="#d95926"><title>10.790882 req/s</title></rect>
<text x="556.0" y="270.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">10.8 req/s</text>
<text x="350.0" y="292.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">Jared Palmer&#x27;s server</text>
<rect x="360" y="281.0" width="105.4" height="14" rx="3" fill="#3987e5"><title>5.983657 req/s</title></rect>
<text x="471.4" y="292.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">5.98 req/s</text>
<text x="814.0" y="292.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon: 80% more answers a second</text>
<text x="16.0" y="340.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">Apple M5 Pro, 48 GB · each value is the median over the same requests · method and versions in docs/benchmarks.md</text>
</svg>
