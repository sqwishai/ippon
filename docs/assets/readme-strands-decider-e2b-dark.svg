<svg xmlns="http://www.w3.org/2000/svg" width="830" height="359" viewBox="0 0 830 359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Strands-Decider-E2B">
<title>Strands-Decider-E2B</title>
<desc>Orange bars are ippon and blue bars another runtime on the same build. Every workload has its own linear scale from zero.</desc>
<rect width="830" height="359" fill="#0d1117"/>
<text x="16.0" y="20.0" font-size="12" font-weight="400" text-anchor="start" fill="#9198a1">ippon in orange, the other runtime in blue, both on the same build</text>
<text x="16.0" y="51.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Typical call</text>
<text x="16.0" y="65.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~500 tokens, 3 questions</text>
<text x="16.0" y="79.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="52.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="41.0" width="66.2" height="14" rx="3" fill="#d95926"><title>75.260000 ms</title></rect>
<text x="432.2" y="52.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">75 ms</text>
<text x="350.0" y="74.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">AWS Strands&#x27; server</text>
<rect x="360" y="63.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>216.045000 ms</title></rect>
<text x="556.0" y="74.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">216 ms</text>
<text x="814.0" y="74.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon 2.9x faster</text>
<text x="16.0" y="119.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Same context again</text>
<text x="16.0" y="133.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~1,000 tokens, a new question</text>
<text x="16.0" y="147.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="120.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="109.0" width="14.3" height="14" rx="3" fill="#d95926"><title>28.880000 ms</title></rect>
<text x="380.3" y="120.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">29 ms</text>
<text x="350.0" y="142.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">AWS Strands&#x27; server</text>
<rect x="360" y="131.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>383.385000 ms</title></rect>
<text x="556.0" y="142.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">383 ms</text>
<text x="814.0" y="142.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon 13x faster</text>
<text x="16.0" y="187.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">Context grown</text>
<text x="16.0" y="201.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">~1,000 tokens and one ~60-token</text>
<text x="16.0" y="215.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">message</text>
<text x="16.0" y="229.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ms, shorter is better</text>
<text x="350.0" y="188.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="177.0" width="41.9" height="14" rx="3" fill="#d95926"><title>136.220000 ms</title></rect>
<text x="407.9" y="188.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">136 ms</text>
<text x="350.0" y="210.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">AWS Strands&#x27; server</text>
<rect x="360" y="199.0" width="190.0" height="14" rx="3" fill="#3987e5"><title>617.410000 ms</title></rect>
<text x="556.0" y="210.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">617 ms</text>
<text x="814.0" y="210.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon 4.5x faster</text>
<text x="16.0" y="269.0" font-size="13" font-weight="600" text-anchor="start" fill="#e6edf3">16 clients at once</text>
<text x="16.0" y="283.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">short requests, 1 question each</text>
<text x="16.0" y="297.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">requests per second, higher is</text>
<text x="16.0" y="311.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">better</text>
<text x="350.0" y="270.0" font-size="11" font-weight="600" text-anchor="end" fill="#e6edf3">ippon</text>
<rect x="360" y="259.0" width="190.0" height="14" rx="3" fill="#d95926"><title>24.203308 req/s</title></rect>
<text x="556.0" y="270.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">24.2 req/s</text>
<text x="350.0" y="292.0" font-size="11" font-weight="400" text-anchor="end" fill="#e6edf3">AWS Strands&#x27; server</text>
<rect x="360" y="281.0" width="75.7" height="14" rx="3" fill="#3987e5"><title>9.639328 req/s</title></rect>
<text x="441.7" y="292.0" font-size="11" font-weight="400" text-anchor="start" fill="#e6edf3">9.64 req/s</text>
<text x="814.0" y="292.0" font-size="12" font-weight="600" text-anchor="end" fill="#e6edf3">ippon: 2.5x the answers a second</text>
<text x="16.0" y="340.0" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">Apple M5 Pro, 48 GB · each value is the median over the same requests · method and versions in docs/benchmarks.md</text>
</svg>
