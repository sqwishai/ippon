name: Feature request
description: Suggest a capability for the library, the CLI or the server.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
      description: The behaviour you'd like, and the alternatives you considered.
    validations:
      required: true
