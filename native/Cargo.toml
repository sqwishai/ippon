[package]
name = "ippon-native"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "ippon's native helpers (loaded by src/ippon/native.py through ctypes)"

[lib]
name = "ippon_native"
crate-type = ["cdylib"]

[dependencies]
rayon = "1.11"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[profile.release]
codegen-units = 1
lto = true
